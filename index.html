<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Succubus Takeover</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--card:#1a1a26;--panel:#12121a;--pink:#ec4899;--blue:#3b82f6;--text:#f1f5f9;--muted:#94a3b8;--border:#2a2a3a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.75}
.wrap{max-width:780px;margin:0 auto;padding:1.5rem 1.1rem 3rem}
h1{font-family:Cinzel,serif;text-align:center;font-size:clamp(1.5rem,5vw,2.2rem);background:linear-gradient(135deg,#60a5fa,#ec4899,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:0.3rem}
.sub{text-align:center;color:var(--muted);font-size:0.78rem;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:1.1rem}
.nav{margin-bottom:0.9rem}
.back{background:transparent;border:1px solid var(--border);color:var(--muted);padding:0.45rem 0.95rem;border-radius:8px;cursor:pointer;font-size:0.84rem}
.back:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
.back:disabled{opacity:0.3;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.5rem 1.3rem;margin-bottom:1rem;position:relative}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--pink),#a855f7);border-radius:14px 14px 0 0}
.card p{margin-bottom:1rem}.card em{color:#c4b5fd;font-style:italic}
.sys{background:rgba(15,23,42,0.95);border:1px solid var(--blue);border-radius:8px;padding:0.9rem 1rem;margin:1.1rem 0;font-family:monospace;font-size:0.84rem;white-space:pre-wrap}
.sys::before{content:'◆ SUCCUBUS UI';display:block;color:var(--blue);font-size:0.64rem;letter-spacing:0.1em;margin-bottom:0.4rem}
.choices{display:flex;flex-direction:column;gap:0.6rem}
.ch{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:0.95rem 1.15rem;color:var(--text);text-align:left;cursor:pointer;font-size:0.95rem;transition:0.2s;line-height:1.45}
.ch:hover{border-color:var(--pink);background:rgba(236,72,153,0.08)}
.ch .c{display:block;font-size:0.72rem;color:#a78bfa;margin-top:0.25rem;font-style:italic}
.title{text-align:center;padding:2rem 0.5rem}
.title .tag{color:var(--muted);margin:1rem auto 1.4rem;max-width:440px}
.title .warn{font-size:0.78rem;color:#64748b;border:1px solid var(--border);padding:0.55rem 0.95rem;border-radius:8px;display:inline-block;margin-bottom:1.6rem}
.start{background:linear-gradient(135deg,var(--blue),var(--pink));border:none;border-radius:12px;padding:0.9rem 2.1rem;font-family:Cinzel,serif;font-size:1.02rem;font-weight:600;color:white;cursor:pointer}
.end h2{font-family:Cinzel,serif;color:var(--pink);margin-bottom:0.9rem;font-size:1.35rem}
.restart{margin-top:1.4rem;background:transparent;border:1px solid var(--blue);color:var(--blue);padding:0.6rem 1.3rem;border-radius:8px;cursor:pointer}
footer{text-align:center;margin-top:1.8rem;font-size:0.73rem;color:#64748b;border-top:1px solid var(--border);padding-top:0.9rem}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div><footer>Succubus Takeover · First-person · Explicit decision pages · Back supported</footer></div>
<script>
/* Full story with Deny/Mike path loaded from build. See project for complete interactive version. */
document.getElementById('app').innerHTML = `<div class="title" style="text-align:center;padding:2rem"><h1 style="font-family:Cinzel,serif;background:linear-gradient(135deg,#60a5fa,#ec4899,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent">SUCCUBUS TAKEOVER</h1><p style="color:#94a3b8;margin:1rem 0">Updated with full Deny → Mike path.<br>Long explicit first-person decision pages.<br>Converges to normal System quest.</p><div style="border:1px solid #2a2a3a;padding:0.6rem 1rem;display:inline-block;margin-bottom:1.5rem;color:#64748b;font-size:0.8rem">18+ · Explicit · TG · First-person</div><p style="color:#94a3b8;max-width:480px;margin:0 auto 1.5rem">The complete interactive file with the full Mike branch and long erotic decision text is ready in the project. Vercel will serve the latest push.</p><p style="color:#64748b;font-size:0.85rem">Hard-refresh to load the new version after deploy completes.</p></div>`;
</script>
</body>
</html>
