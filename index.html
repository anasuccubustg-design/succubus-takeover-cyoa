<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Succubus Takeover – Expanded CYOA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0a0a0f;
      --bg-panel: #12121a;
      --bg-card: #1a1a26;
      --accent-blue: #3b82f6;
      --accent-blue-glow: rgba(59, 130, 246, 0.35);
      --accent-pink: #ec4899;
      --accent-pink-glow: rgba(236, 72, 153, 0.3);
      --accent-purple: #a855f7;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border: #2a2a3a;
      --system-bg: rgba(15, 23, 42, 0.95);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.7;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: 
        radial-gradient(ellipse 80% 50% at 20% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(236, 72, 153, 0.07) 0%, transparent 50%),
        radial-gradient(ellipse 50% 30% at 50% 50%, rgba(168, 85, 247, 0.05) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }
    .container { position: relative; z-index: 1; max-width: 820px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    header { text-align: center; margin-bottom: 2rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border); }
    header h1 {
      font-family: 'Cinzel', serif; font-size: clamp(1.6rem, 5vw, 2.4rem); font-weight: 700; letter-spacing: 0.08em;
      background: linear-gradient(135deg, #60a5fa 0%, #ec4899 50%, #a855f7 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 0.3rem;
    }
    header .subtitle { font-size: 0.85rem; color: var(--text-muted); letter-spacing: 0.15em; text-transform: uppercase; }
    .status-bar {
      display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; align-items: center;
      background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 0.8rem 1.2rem; margin-bottom: 1.5rem; font-size: 0.85rem;
    }
    .status-item { display: flex; align-items: center; gap: 0.5rem; }
    .status-label { color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.7rem; }
    .meter { width: 110px; height: 8px; background: #1e1e2e; border-radius: 4px; overflow: hidden; }
    .meter-fill { height: 100%; border-radius: 4px; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
    .meter-fill.resistance { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
    .meter-fill.corruption { background: linear-gradient(90deg, #ec4899, #a855f7); }
    .status-value { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; min-width: 2.5rem; text-align: right; }
    .story-panel {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
      padding: 1.75rem 1.5rem; margin-bottom: 1.4rem; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      position: relative; overflow: hidden;
    }
    .story-panel::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-pink), var(--accent-purple));
    }
    .story-text { font-size: 1.02rem; color: var(--text-primary); }
    .story-text p { margin-bottom: 1rem; }
    .story-text p:last-child { margin-bottom: 0; }
    .story-text em { color: #c4b5fd; font-style: italic; }
    .story-text strong { color: #f9a8d4; font-weight: 600; }
    .system-window {
      background: var(--system-bg); border: 1px solid var(--accent-blue); border-radius: 10px;
      padding: 1rem 1.2rem; margin: 1.4rem 0; font-family: 'JetBrains Mono', monospace; font-size: 0.86rem;
      box-shadow: 0 0 24px var(--accent-blue-glow);
    }
    .system-window::before {
      content: '◆ SUCCUBUS UI'; display: block; font-size: 0.68rem; letter-spacing: 0.12em;
      color: var(--accent-blue); margin-bottom: 0.55rem; opacity: 0.9;
    }
    .system-window .alert { color: #fca5a5; }
    .system-window .reward { color: #86efac; }
    .system-window .quest { color: #93c5fd; }
    .choices { display: flex; flex-direction: column; gap: 0.7rem; }
    .choice-btn {
      background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 0.95rem 1.2rem; color: var(--text-primary); font-family: inherit; font-size: 0.96rem;
      text-align: left; cursor: pointer; transition: all 0.25s ease;
    }
    .choice-btn:hover {
      border-color: var(--accent-pink); background: rgba(236, 72, 153, 0.08);
      transform: translateX(4px); box-shadow: 0 0 20px var(--accent-pink-glow);
    }
    .choice-btn .choice-hint { display: block; font-size: 0.76rem; color: var(--text-muted); margin-top: 0.3rem; }
    .title-screen { text-align: center; padding: 2.5rem 1rem; }
    .title-screen h1 {
      font-family: 'Cinzel', serif; font-size: clamp(2rem, 7vw, 3.2rem); font-weight: 700; letter-spacing: 0.1em;
      background: linear-gradient(135deg, #60a5fa, #ec4899, #a855f7);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.7rem;
    }
    .title-screen .tagline { font-size: 1.05rem; color: var(--text-secondary); margin-bottom: 1.8rem; max-width: 480px; margin-left: auto; margin-right: auto; }
    .title-screen .warning {
      font-size: 0.82rem; color: var(--text-muted); margin-bottom: 2.2rem; padding: 0.7rem 1rem;
      border: 1px solid var(--border); border-radius: 8px; display: inline-block;
    }
    .start-btn {
      background: linear-gradient(135deg, #3b82f6, #ec4899); border: none; border-radius: 12px;
      padding: 1rem 2.4rem; font-family: 'Cinzel', serif; font-size: 1.1rem; font-weight: 600;
      letter-spacing: 0.08em; color: white; cursor: pointer; transition: all 0.3s ease;
      box-shadow: 0 4px 24px rgba(236, 72, 153, 0.35);
    }
    .start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(236, 72, 153, 0.5); }
    .ending-panel { text-align: center; padding: 0.5rem 0; }
    .ending-panel h2 { font-family: 'Cinzel', serif; font-size: 1.5rem; margin-bottom: 1rem; color: var(--accent-pink); }
    .restart-btn {
      margin-top: 1.8rem; background: transparent; border: 1px solid var(--accent-blue); border-radius: 10px;
      padding: 0.7rem 1.6rem; color: var(--accent-blue); font-family: inherit; font-size: 0.92rem; cursor: pointer;
      transition: all 0.25s ease;
    }
    .restart-btn:hover { background: rgba(59, 130, 246, 0.15); }
    footer { text-align: center; margin-top: 2.5rem; padding-top: 1.3rem; border-top: 1px solid var(--border); font-size: 0.78rem; color: var(--text-muted); }
    .fade-in { animation: fadeIn 0.45s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 540px) {
      .status-bar { flex-direction: column; align-items: flex-start; gap: 0.7rem; }
      .story-panel { padding: 1.4rem 1.1rem; }
      .meter { width: 95px; }
    }
  </style>
</head>

</body>
</html>
